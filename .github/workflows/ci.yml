name: CI

# Every pushed branch runs CI. PRs from this repo are already covered by that push run,
# so the pull_request event only runs for PRs from forks (see the job conditions).
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --no-sync ruff check --output-format=github .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      # The Play Zone CSVs are private (not in git); most bot tests read them.
      - name: Fetch private data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run --no-sync python scripts/fetch_private_data.py

      - name: Test with coverage
        run: uv run --no-sync pytest --cov --cov-report=term

      - name: Coverage summary
        if: always()
        run: uv run --no-sync coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker image
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # models/ (the AI 入坑 v2 encoder) only lives in the Space repo, so this image
      # exercises the v1 fallback.
      - name: Build image
        run: docker build -t kpop-agent .

      - name: Smoke test /health
        run: |
          docker run -d --name kpop-agent -p 7860:7860 kpop-agent
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:7860/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs kpop-agent
          exit 1
